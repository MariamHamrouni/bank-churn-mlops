name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # ⚠️ REMPLACEZ CES VALEURS PAR LES VÔTRES ⚠️
  AZURE_RESOURCE_GROUP: rg-mlops-bank-churn
  ACR_NAME: mlopsnevermind          # Le nom de VOTRE ACR (étape 5.1)
  CONTAINER_APP_NAME: bank-churn    # Le nom de VOTRE Container App (étape 5.2)
  IMAGE_NAME: bank-churn-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=term

  build-and-deploy:
    needs: test  # Ne s'exécute QUE si les tests réussissent
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Ne déploie que depuis 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}  # Utilise le secret formaté
      - name: Login to Azure Container Registry (ACR)
        uses: azure/docker-login@v1
        with:
             client-id: ${{ secrets.c9091b5e-8150-46ad-adec-229ec0b463db }}  # Secret pour le client ID
        client-secret: ${{ secrets.jcL8Q~6trLw4jGecx18SRlQuqVOMCrESihR77aQc }}  # Secret pour le client secret
        tenant-id: ${{ secrets.b7bd4715-4217-48c7-919e-2ea97f592fa7 }}  # Secret pour le tenant ID
        subscription-id: ${{ secrets.63050e73-198b-493b-8b7e-ff083e93a176 }}  # Secret pour le subscription ID
      - name: Build and push Docker image
        run: |
          # Construit l'image et la tagge avec le hash unique du commit
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          # Crée aussi un tag 'latest' pour référence
          docker tag ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          # Pousse les deux images vers l'ACR
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          echo "✅ Images poussées dans ACR."
      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            echo "✅ Commande de déploiement envoyée à Azure."
      - name: Verify deployment
        run: |
          # Récupère l'URL publique de l'application
          APP_URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "🌐 Votre API est déployée à l'adresse : https://$APP_URL"
          echo "🩺 Attente du démarrage (20s) et vérification..."
          sleep 20
          # Teste le endpoint /health
          curl -f https://$APP_URL/health || exit 1
          echo "✅ Déploiement vérifié et réussi !"